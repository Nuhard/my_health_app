name: nutritrack
description: "NutriTrack - A comprehensive Health & Nutrition Monitoring App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  image_cropper: ^11.0.0
  
  # Firebase - Compatible versions
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_analytics: ^11.3.4
  firebase_messaging: ^15.1.4
  firebase_storage: ^12.3.4

  # Offline & Sync (ONLY for mobile/desktop, NOT web)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.0.5
  path: ^1.9.0

  # State Management
  provider: ^6.1.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4 
  
  # API & HTTP
  http: ^1.2.2
  
  # Charts & Analytics
  fl_chart: ^0.69.0

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.13.3  
  open_file: ^3.3.2
  universal_html: ^2.0.7
  file_saver: ^0.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/food.json
    - assets/data/nutrition_database.json
    - assets/data/symptoms_database.json
    - assets/data/doctors_database.json
    - assets/data/activities_database.json
    - assets/data/icon/



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/data/icon/nutritrack.png"
  adaptive_icon_background: "#7B68EE" 
  adaptive_icon_foreground: "assets/data/icon/nutritrack.png"
  remove_alpha_ios: true